default_roles:
  - bash
  - git
  - lazygit
  - font
  - go
  - nodejs
  - nvim
  - hyprland
  - hyprdot
  - ghostty
  - fuzzel
  - flatpak
  - app
  - steam
  - ssh
  - noctalia
  - nnn
  - typst

op:
  git:
    # Which deployed public key signs commits, by `name` in op.ssh below.
    signing_key: github_key
  ssh:
    github:
      notfoundy:
        - name: github_key
          vault_path: "op://Private/github_key"
        - name: n8n_key
          vault_path: "op://Private/n8n_key"
