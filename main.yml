- hosts: localhost
  connection: local
  tasks:
    - name: Set roles
      ansible.builtin.set_fact:
        selected_roles: >-
          {{ (default_roles | difference(exclude_roles | default([])))
             if 'all' in ansible_run_tags
             else ansible_run_tags }}
      tags:
        - always

    - name: Display roles
      ansible.builtin.debug:
        var: selected_roles
      tags:
        - always

    - name: Run roles
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ selected_roles }}"
      tags:
        - always
