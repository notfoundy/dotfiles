- name: Configure commit signing
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - name: gpg.format
      value: ssh
    - name: gpg.ssh.program
      value: /opt/1Password/op-ssh-sign
    - name: user.signingkey
      value: "{{ ansible_facts['user_dir'] }}/.ssh/{{ op.git.signing_key }}.pub"
    - name: commit.gpgsign
      value: "true"

- name: Drop tag signing
  community.general.git_config:
    name: tag.gpgsign
    scope: global
    state: absent
