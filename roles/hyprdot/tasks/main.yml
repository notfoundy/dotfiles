- name: Copy hyprland config
  ansible.builtin.copy:
    src: files/
    dest: "{{ ansible_facts['user_dir'] }}/.config/hypr/"
    mode: "0644"

- name: Copy hyprland executable scripts
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/hypr/{{ item }}"
    mode: "0755"
  loop:
    - scripts/

- name: Configure cursor theme
  ansible.builtin.include_tasks: cursor.yml
