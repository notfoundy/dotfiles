- name: "Checking config for {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] | lower }}.yml"
  register: distribution_config
  delegate_to: localhost

- name: "Run Tasks for {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] | lower }}.yml"
  when: distribution_config.stat.exists

- name: Install hypr tool
  ansible.builtin.package:
    name: hyprlock
    state: present
  become: true

- name: Copy hyprland config
  ansible.builtin.copy:
    src: files/
    dest: "{{ ansible_facts['user_dir'] }}/.config/hypr/"
    mode: "0644"

- name: Copy hyprland executable scripts
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/hypr/{{ item }}"
    mode: "0755"
  loop:
    - scripts/
    - hyprlock/check-capslock.sh
    - hyprlock/status.sh
