- name: "Checking config for {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] | lower }}.yml"
  register: distribution_config
  delegate_to: localhost

- name: "Run Tasks for {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] | lower }}.yml"
  when: distribution_config.stat.exists

- name: Install packages
  ansible.builtin.package:
    name:
      # Development
      - tokei
      - lazygit
      - httpie
      # Utils
      - zoxide
      # - exa
      - bat
      - fd-find
      - ripgrep
      - aspell
      - btop
      - hyperfine
      - ncdu
      - tealdeer
      - unzip
      - tar
      - ffmpeg-free
      - syncthing
      # General UI utilities
      - wl-clipboard
      - brightnessctl
      - playerctl
      # Icons
      - papirus-icon-theme
    state: present
  become: true
