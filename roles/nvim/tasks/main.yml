- name: Searching for neovim config
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.config/nvim"
  register: neovim_config
  changed_when: false
  failed_when: false

- name: Install lazyvim
  ansible.builtin.git:
    repo: https://github.com/LazyVim/starter
    dest: "{{ ansible_facts['user_dir'] }}/.config/nvim"
  when: neovim_config.stat.exists == false

- name: Search for git folder in neovim config
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.config/nvim/.git"
  register: git_folder
  changed_when: false
  failed_when: false

- name: Remove git folder in neovim config
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/nvim/.git"
    state: absent
  when: git_folder.stat.exists

