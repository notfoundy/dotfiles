- name: Disable outdated copr
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:solopasha:hyprland.repo
    - /etc/yum.repos.d/_copr_solopasha-hyprland.repo
  become: true

- name: Enable copr
  community.general.copr:
    name: sdegler/hyprland
    state: enabled
  become: true

- name: Update dnf cache
  ansible.builtin.dnf:
    update_cache: true
  become: true

- name: Install hyprpolkitagent
  ansible.builtin.package:
    name: hyprpolkitagent
    state: present
  become: true
  notify: Reload systemd daemon
