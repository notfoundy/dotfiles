- name: Create xdg-desktop-portal-hyprland config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal"
    state: directory
    mode: "0755"

- name: Copy xdg-desktop-portal-hyprland config
  ansible.builtin.copy:
    src: "files/hyprland-portals.conf"
    dest: "{{ ansible_facts['user_dir'] }}/.config/xdg-desktop-portal/hyprland-portals.conf"
    mode: "0644"
