- name: "Checking for: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] | lower }}.yml"
  register: distribution_config
  delegate_to: localhost

- name: "Run Tasks: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] | lower }}.yml"
  when: distribution_config.stat.exists

- name: Install
  ansible.builtin.package:
    name: starship
    state: present
  become: true

