- name: Copy wallpapers
  ansible.builtin.copy:
    src: files/wallpapers/
    dest: "{{ ansible_facts['user_dir'] }}/Pictures/Wallpapers/"
    mode: "0644"

- name: Create Noctalia state directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/state/noctalia"
    state: directory
    mode: "0755"

- name: Link Noctalia configuration to the repository
  ansible.builtin.file:
    src: "{{ role_path }}/files/config"
    dest: "{{ ansible_facts['user_dir'] }}/.config/noctalia"
    state: link
    force: true

- name: Check Noctalia settings
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/state/noctalia/settings.toml"
  register: noctalia_settings

# Replaces the symlink earlier versions of the role created
- name: Remove Noctalia settings symlink
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/state/noctalia/settings.toml"
    state: absent
  when: noctalia_settings.stat.islnk | default(false)

# Seeded once, then synced by hand: the settings GUI owns this file
- name: Copy Noctalia settings
  ansible.builtin.copy:
    src: files/settings.toml
    dest: "{{ ansible_facts['user_dir'] }}/.local/state/noctalia/settings.toml"
    mode: "0644"
    force: false

- name: Configure qt6ct
  community.general.ini_file:
    path: "{{ ansible_facts['user_dir'] }}/.config/qt6ct/qt6ct.conf"
    section: Appearance
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - { option: custom_palette, value: "true" }
    - { option: color_scheme_path, value: "{{ ansible_facts['user_dir'] }}/.config/qt6ct/colors/noctalia.conf" }
    - { option: icon_theme, value: Papirus-Dark }
    - { option: style, value: Fusion }
  loop_control:
    label: "{{ item.option }}"
