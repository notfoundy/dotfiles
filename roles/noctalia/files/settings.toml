config_version = 14

[bar.main]
background_opacity = 0.74999998323619366
center = [ "clock", "notifications" ]
end = [ "tray", "network", "bluetooth", "volume", "battery" ]
font_family = "Inter"
padding = 18
radius_bottom_left = 18
radius_bottom_right = 18
start = [ "control-center", "workspaces" ]
thickness = 38
widget_spacing = 12

[calendar]
enabled = true

    [calendar.account.home_nextcloud]
    name = "nuage"
    provider = "custom"
    server_url = "https://app.nu4ge.com/remote.php/dav/"
    type = "caldav"
    username = "demo@nu4ge.com"

[control_center]
sidebar = "none"
width = 800

    [control_center.calendar]
    show_week_numbers = true

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "dark_mode"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
history_retention_hours = 6

[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
enabled = false
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[shell.launcher]
categories = false
show_app_actions = true
show_app_origin_indicator = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper.automation]
enabled = true

[wallpaper.default]
path = "/home/notfoundy/Pictures/Wallpapers/1345130.jpeg"

[wallpaper.last]
path = "/home/notfoundy/Pictures/Wallpapers/1345130.jpeg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/notfoundy/Pictures/Wallpapers/1345130.jpeg"

[wallpaper.monitors.eDP-1]
path = "/home/notfoundy/Pictures/Wallpapers/1345130.jpeg"

[widget.clock]
format = "{:%-d %b  %H:%M}"

[widget.workspaces]
font_family = "Inter"
font_scale = 1.1000000000000001
inactive_pill_size = 1.6000000000000001
pill_scale = 1.0
show_labels = true