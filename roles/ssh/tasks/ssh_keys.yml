- name: "Get public key from Vault: [{{ item.name }}]"
  ansible.builtin.command: "op read --account my.1password.eu '{{ item.vault_path }}/public_key'"
  register: op_public_key
  changed_when: false

- name: "Deploy public key: [{{ item.name }}]"
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ item.name }}.pub"
    content: "{{ op_public_key.stdout }}"
    mode: "0644"

# Left by earlier runs: the 1Password agent serves the private key.
- name: "Remove on-disk private key: [{{ item.name }}]"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/{{ item.name }}"
    state: absent
