# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# The archive and checksum names deliberately carry no version: it is what makes
# the /releases/latest/download/ URLs stable, so `dotfiles self-update` needs
# neither a GitHub API call nor jq. See cli/internal/selfupdate.
#
# GoReleaser only builds: .github/workflows/release.yml publishes the release with
# gh, since the cli-v* tags are not semver and tag prefixes need GoReleaser Pro.
version: 2

project_name: dotfiles

before:
  hooks:
    - go mod tidy -C cli
    - go test -C cli ./...

builds:
  - id: dotfiles
    dir: cli
    main: .
    binary: dotfiles
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: dotfiles
    formats:
      - tar.gz
    name_template: dotfiles_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true
