# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

# No version in the asset names: `dotfiles self-update` relies on stable
# /releases/latest/download/ URLs.
#
# release.yml publishes with gh: cli-v* tags are not semver, and tag prefixes
# need GoReleaser Pro.
version: 2

project_name: dotfiles

before:
  hooks:
    - go mod tidy -C cli
    - go test -C cli ./...

builds:
  - id: dotfiles
    dir: cli
    main: .
    binary: dotfiles
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: dotfiles
    formats:
      - tar.gz
    name_template: dotfiles_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true
